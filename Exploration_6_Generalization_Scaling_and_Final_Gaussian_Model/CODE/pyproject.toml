[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puma-exploration6"
version = "0.1.0"
description = "PUMA Stage-2 Exploration-6 generalization-first experiment package"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "Pillow>=10,<13",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "psutil>=5.9",
  "shapely>=2.0",
]

[project.optional-dependencies]
uni2 = ["timm==1.0.20"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
