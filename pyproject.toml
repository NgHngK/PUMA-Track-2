[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puma-biocontext-refine"
version = "0.1.0"
description = "Leakage-safe biology-aware PUMA Track-2 nuclei classification pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "tifffile>=2024.2", "timm>=1.0.15,<2", "huggingface-hub>=0.23,<1", "scikit-image>=0.22,<1", "tqdm>=4.66,<5"]


[tool.setuptools.packages.find]
where = ["src"]
